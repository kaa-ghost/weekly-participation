services:
  - type: web
    name: weekly-participation
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: admin123  # смените перед первым запуском
      - key: DATABASE_URL
        fromDatabase:
          name: weekly-db
          property: connectionString

databases:
  - name: weekly-db
    databaseName: weekly_participation
    user: weekly_user

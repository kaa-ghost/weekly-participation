{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 420px;"><div class="card-body">
  <h4 class="mb-3">Регистрация</h4>
  <form method="post">
    <div class="mb-3"><label class="form-label">Имя</label>
      <input name="name" class="form-control"></div>
    <div class="mb-3"><label class="form-label">Email (логин)</label>
      <input type="email" name="email" class="form-control" required autofocus></div>
    <div class="mb-3"><label class="form-label">Пароль</label>
      <input type="password" name="password" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Повторите пароль</label>
      <input type="password" name="confirm" class="form-control" required></div>
    <button class="btn btn-primary w-100">Зарегистрироваться</button>
  </form>
  <p class="mt-3 mb-0 text-center">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
</div></div>
{% endblock %}

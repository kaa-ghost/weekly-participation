{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 420px;"><div class="card-body">
  <h4 class="mb-3">Вход</h4>
  <form method="post">
    <div class="mb-3"><label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required autofocus></div>
    <div class="mb-3"><label class="form-label">Пароль</label>
      <input type="password" name="password" class="form-control" required></div>
    <button class="btn btn-primary w-100">Войти</button>
  </form>
  <p class="mt-3 mb-0 text-center">Нет аккаунта? <a href="{{ url_for('register') }}">Регистрация</a></p>
</div></div>
{% endblock %}

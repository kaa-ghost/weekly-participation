{% extends "base.html" %}
{% block title %}{{ 'Изменить' if project else 'Создать' }} проект{% endblock %}
{% block content %}
<h4>{{ 'Изменить' if project else 'Создать' }} проект</h4>
<form method="post" class="card"><div class="card-body">
  <div class="mb-3">
    <label class="form-label">Название</label>
    <input name="name" class="form-control" value="{{ project.name if project else '' }}" required>
  </div>
  <div class="form-check mb-3">
    <input type="checkbox" name="active" class="form-check-input" id="active"
           {% if not project or project.active %}checked{% endif %}>
    <label class="form-check-label" for="active">Активен (доступен для выбора)</label>
  </div>
  <button class="btn btn-primary">Сохранить</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('admin_projects') }}">Отмена</a>
</div></form>
{% endblock %}

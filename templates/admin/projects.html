{% extends "base.html" %}
{% block title %}Проекты{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Проекты</h4>
  <a class="btn btn-primary btn-sm" href="{{ url_for('admin_project_create') }}">+ Создать</a>
</div>
<table class="table table-striped align-middle">
  <thead><tr><th>Название</th><th>Статус</th><th></th></tr></thead>
  <tbody>
  {% for p in projects %}
    <tr>
      <td>{{ p.name }}</td>
      <td>{% if p.active %}<span class="badge bg-success">активен</span>{% else %}<span class="badge bg-secondary">архив</span>{% endif %}</td>
      <td class="text-end">
        <a class="btn btn-outline-primary btn-sm" href="{{ url_for('admin_project_edit', project_id=p.id) }}">Изменить</a>
        <form method="post" class="d-inline" action="{{ url_for('admin_project_delete', project_id=p.id) }}"
              onsubmit="return confirm('Удалить проект и все записи участия?')">
          <button class="btn btn-outline-danger btn-sm">Удалить</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
